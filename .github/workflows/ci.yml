name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core and ansible-lint
        run: python -m pip install --quiet "ansible-core>=2.15" "ansible-lint>=25"
      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Create a dummy vault password file
        # ansible.cfg names .vault_pass, which is gitignored. Nothing tracked
        # is vault-encrypted, so the value is never used — the file only has
        # to exist for ansible-playbook to start.
        run: echo ci-dummy > .vault_pass
      - name: Playbook syntax check
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook verify.yml --syntax-check
      - name: ansible-lint (production profile)
        run: ansible-lint --strict --sarif-file=ansible-lint.sarif
      - name: Upload ansible-lint findings to code scanning
        if: always() && hashFiles('ansible-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ansible-lint.sarif
