---
# Tunables for the headscale role with secure defaults.

headscale_version: "0.29.3"
headscale_image: "ghcr.io/juanfont/headscale"

# Required settings: set in group_vars/all/vars.yml (gitignored).
headscale_server_url: ""
headscale_domain: ""
headscale_dns_magic_domain: ""
headscale_host_ip: ""
headscale_traefik_dynamic_dir: ""

# Headscale username that owns operator-managed nodes.
# Used by ACL autoApprovers so nodes owned by this user can advertise
# exit nodes or subnets without requiring manual approval.
headscale_admin_user: ""

# Listen addresses.
# Bind to 0.0.0.0 so Traefik can reach the container via the host IP.
# Metrics bind to localhost only (port 9091 avoids collision with Cockpit on 9090).
headscale_listen_addr: "0.0.0.0:8080"
headscale_metrics_addr: "0.0.0.0:9091"
headscale_host_port: 8080
headscale_metrics_host_port: 9091

# Filesystem paths on the host.
headscale_config_dir: "/mnt/config/headscale"
headscale_data_dir: "/mnt/config/headscale/data"

# Database type. Upstream recommends SQLite.
headscale_db_type: "sqlite"

# Logging configuration.
headscale_log_level: "warn"
headscale_log_format: "json"

# DERP: uses Tailscale's public DERP servers by default.
headscale_embedded_derp_enabled: false

# Headscale internal ACME is disabled; Traefik manages TLS termination.
headscale_acme_hostname: ""

# MagicDNS is disabled by default to avoid altering DNS behavior unexpectedly.
headscale_magic_dns: false

# DNS resolvers pushed to clients when accepting DNS (--accept-dns=true).
# An empty list leaves local client resolvers unchanged.
headscale_dns_global_nameservers:
  - "1.1.1.1"
  - "1.0.0.1"

# Ephemeral node inactivity timeout. Must exceed 1m5s per Headscale requirements.
headscale_ephemeral_node_inactivity_timeout: "30m"

# Subnet allowed to reach Headscale directly (the container bridge).
# Packets from other sources are dropped in mangle PREROUTING before DNAT.
# Covers the container bridge subnet (such as 10.88.0.0/16) so dynamic proxy IP leases
# can reach the backend without static IP collisions.
headscale_trusted_network: "10.88.0.0/16"

# Additional source networks permitted to access the backend port.
# Rendered as higher-priority RETURN exceptions in mangle PREROUTING.
# Useful for multi-homed reverse proxy containers routing from secondary subnets.
headscale_trusted_proxy_networks: []

# Optional split-DNS records served by MagicDNS to tailnet peers.
# Each entry is a mapping: {name, value, type?} (type defaults to A).
headscale_dns_extra_records: []

# Distroless non-root user UID/GID matching the container image runtime user.
headscale_container_uid: 65532
headscale_container_gid: 65532

# Optional Headscale-UI companion web interface.
headscale_ui_enabled: false
headscale_ui_version: "2026.03.17"
headscale_ui_image: "ghcr.io/gurucomputing/headscale-ui"
headscale_ui_domain: ""
headscale_ui_host_port: 3000

# Self-healing watchdog settings.
# Runs an on-host systemd timer to probe reachability and repair service failures.
headscale_watchdog_enabled: true
headscale_watchdog_interval: "2min"
headscale_watchdog_confirm_probes: 2
headscale_watchdog_confirm_gap: 15
headscale_watchdog_probe_timeout: 10

# Post-repair settle budgets (in seconds).
# After a repair action, the watchdog probes external health until it recovers
# or until the settle budget expires.
headscale_watchdog_settle_gap: 5
headscale_watchdog_settle_reload: 15
headscale_watchdog_settle_traefik: 30
headscale_watchdog_settle_headscale: 60

# Maximum execution timeout for the watchdog oneshot service (in seconds).
headscale_watchdog_service_timeout: 480

# Reverse proxy integration parameters.
headscale_watchdog_traefik_container: "traefik"
headscale_watchdog_trusted_gateway: "10.88.0.1"
headscale_watchdog_reload_containers: "traefik headscale"

# Traefik restart toggle. Disabled by default; enable only if the proxy can safely restart offline.
headscale_watchdog_traefik_restart_enabled: false

# Anti-thrash rate limiting: maximum repair operations within the rolling window.
headscale_watchdog_repair_cap: 3
headscale_watchdog_repair_window: 3600
headscale_watchdog_backoff_interval: 900

# Deploy collision guard: skip automated repairs while a deployment is active.
headscale_watchdog_deploy_lock: "/run/headscale-deploy.lock"
headscale_watchdog_deploy_lock_max_age: 1800

# Alert notifications.
headscale_watchdog_notify_bin: ""
headscale_watchdog_alert_email: "{{ headscale_admin_email | default('') }}"
headscale_watchdog_alert_dedup_window: 3600
