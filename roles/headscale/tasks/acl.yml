---
- name: ACL — deploy headscale ACL policy
  become: true
  ansible.builtin.template:
    src: acl.hujson.j2
    dest: "{{ headscale_config_dir }}/acl.hujson"
    owner: "65532"
    group: "65532"
    mode: "0600"
  # No notify — see config.yml. The restart is an explicit rescuable task gated on
  # this register. See plan 26 (finding: fail-to-start not rescued via handler).
  register: headscale_acl_render
