---
- name: Quadlet — deploy headscale container unit
  become: true
  ansible.builtin.template:
    src: headscale.container.j2
    dest: "{{ headscale_quadlet_dir }}/headscale.container"
    owner: root
    group: root
    mode: "0600"
  notify: Restart headscale

# Flush handlers immediately so daemon-reload + restart happen BEFORE the
# enable/start task below. Without the flush, enable/start would run against
# whatever podman-system-generator emitted on the previous boot, missing any
# changes from this apply.
- name: Quadlet — flush handlers (daemon-reload + restart if unit changed)
  ansible.builtin.meta: flush_handlers

- name: Quadlet — enable and start headscale service
  become: true
  ansible.builtin.systemd:
    name: "{{ headscale_service }}"
    state: started
    enabled: true
  # In check mode on first install the Quadlet file hasn't been written yet,
  # so systemd doesn't know the service. Safe to ignore in check mode only.
  ignore_errors: "{{ ansible_check_mode }}"
