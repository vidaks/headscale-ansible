---
# Render ONLY here. The daemon-reload + restart + enable/start deliberately live
# in main.yml's rollback-protected block as EXPLICIT tasks (gated on this
# register), NOT a handler flushed here: a handler restart that fails to start the
# container aborts during flush_handlers, which the rollback rescue does NOT catch
# — so a fail-to-start upgrade would strand headscale on the bad image with no
# auto-rollback. See plan 26 (finding: fail-to-start not rescued).
- name: Quadlet — deploy headscale container unit
  become: true
  ansible.builtin.template:
    src: headscale.container.j2
    dest: "{{ headscale_quadlet_dir }}/headscale.container"
    owner: root
    group: root
    mode: "0600"
  register: headscale_quadlet_render
